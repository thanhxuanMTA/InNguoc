<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>In chữ ngược gương - UTM HelvetIns - A4</title>

<style>

/* =========================================================
   FONT UTM HELVETINS
   Đặt file:
   UTM HelvetIns.ttf
   cùng thư mục với file HTML
   ========================================================= */

@font-face {
    font-family: "UTM HelvetIns";

    src:
        url("./UTM HelvetIns.ttf")
        format("truetype");

    font-weight: normal;
    font-style: normal;

    font-display: swap;
}


/* =========================================================
   TRANG
   ========================================================= */

@page {
    size: A4 portrait;
    margin: 0;
}


* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;
}


body {

    background: #e9edf1;

    color: #111;

    font-family:
        Arial,
        sans-serif;
}


/* =========================================================
   THANH ĐIỀU KHIỂN
   ========================================================= */

.toolbar {

    width: min(
        1200px,
        calc(100% - 24px)
    );

    margin: 14px auto;

    padding: 16px;

    background: #fff;

    border-radius: 12px;

    box-shadow:
        0 3px 18px
        rgba(0,0,0,.12);
}


h1 {

    margin: 0 0 8px;

    font-size: 21px;
}


.description {

    margin-bottom: 14px;

    color: #555;

    font-size: 13px;

    line-height: 1.5;
}


/* =========================================================
   Ô NHẬP
   ========================================================= */

textarea {

    width: 100%;

    min-height: 105px;

    resize: vertical;

    padding: 10px;

    border:
        1px solid #bbb;

    border-radius: 8px;

    outline: none;

    font-family:
        "UTM HelvetIns",
        Arial,
        sans-serif;

    font-size: 20px;

    line-height: 1.3;
}


textarea:focus,
input:focus,
select:focus {

    border-color: #555;

    box-shadow:
        0 0 0 2px
        rgba(0,0,0,.08);
}


/* =========================================================
   CONTROLS
   ========================================================= */

.controls {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(150px, 1fr)
        );

    gap: 10px;

    margin-top: 14px;
}


.control {

    display: flex;

    flex-direction: column;

    gap: 5px;
}


.control label {

    font-size: 13px;

    font-weight: bold;
}


input,
select {

    width: 100%;

    height: 36px;

    padding:
        5px 8px;

    border:
        1px solid #bbb;

    border-radius: 6px;

    background: white;

    color: #111;

    outline: none;
}


input[type="range"] {

    padding: 0;
}


/* =========================================================
   NÚT
   ========================================================= */

.buttons {

    display: flex;

    gap: 8px;

    margin-top: 14px;

    flex-wrap: wrap;
}


button {

    border: none;

    border-radius: 7px;

    padding:
        10px 16px;

    background: #222;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


button:hover {

    background: #444;
}


button.secondary {

    background: #e5e5e5;

    color: #111;
}


/* =========================================================
   VÙNG XEM TRƯỚC
   ========================================================= */

.workspace {

    display: flex;

    justify-content: center;

    padding: 15px;
}


.page {

    position: relative;

    width: 210mm;

    height: 297mm;

    background: white;

    overflow: hidden;

    box-shadow:
        0 4px 22px
        rgba(0,0,0,.22);
}


/* =========================================================
   CHỮ
   ========================================================= */

.text {

    position: absolute;

    /*
       Chiều rộng vùng chữ.
       Tâm vùng nằm tại X.
    */

    width: 190mm;

    left: 0;

    top: 0;

    white-space: pre-wrap;

    word-break: normal;

    font-family:
        "UTM HelvetIns",
        Arial,
        sans-serif;

    color: #000;

    line-height: 1;

    text-align: center;

    transform-origin:
        center center;

    user-select: none;
}


/* =========================================================
   TÂM
   ========================================================= */

.center-point {

    position: absolute;

    width: 2mm;

    height: 2mm;

    margin-left: -1mm;

    margin-top: -1mm;

    border-radius: 50%;

    background: red;

    display: none;

    pointer-events: none;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width: 800px) {

    .controls {

        grid-template-columns:
            repeat(2, 1fr);
    }


    .page {

        transform:
            scale(.65);

        transform-origin:
            top center;

        margin-bottom:
            -104mm;
    }
}


/* =========================================================
   IN / PDF
   ========================================================= */

@media print {

    html,
    body {

        width: 210mm;

        height: 297mm;

        margin: 0;

        padding: 0;

        background: white;
    }


    .toolbar {

        display: none !important;
    }


    .workspace {

        display: block;

        padding: 0;
    }


    .page {

        width: 210mm;

        height: 297mm;

        margin: 0;

        box-shadow: none;

        transform: none !important;
    }


    .center-point {

        display: none !important;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     THANH ĐIỀU KHIỂN
===================================================== -->

<div class="toolbar">

    <h1>
        IN CHỮ NGƯỢC GƯƠNG · UTM HelvetIns · A4
    </h1>


    <div class="description">

        Chữ được lật ngang như nhìn qua gương.
        Có thể chỉnh chiều cao chữ, co ngang,
        vị trí và chiều lật.

    </div>


    <!-- =================================================
         NỘI DUNG
    ================================================= -->

    <textarea
        id="textInput"
        spellcheck="false"
    >CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</textarea>


    <!-- =================================================
         CONTROLS
    ================================================= -->

    <div class="controls">


        <!-- CỠ CHỮ -->

        <div class="control">

            <label>
                Chiều cao chữ in hoa (cm)
            </label>

            <input
                id="capHeight"
                type="number"

                min="0.1"
                max="50"

                step="0.1"

                value="2"
            >

        </div>


        <!-- CO NGANG -->

        <div class="control">

            <label>

                Co ngang:
                <span id="scaleValue">
                    100
                </span>%

            </label>

            <input
                id="scaleX"
                type="range"

                min="10"
                max="300"

                step="1"

                value="100"
            >

        </div>


        <!-- VỊ TRÍ X -->

        <div class="control">

            <label>
                Vị trí X (mm)
            </label>

            <input
                id="posX"
                type="number"

                min="-100"
                max="310"

                step="0.1"

                value="105"
            >

        </div>


        <!-- VỊ TRÍ Y -->

        <div class="control">

            <label>
                Vị trí Y (mm)
            </label>

            <input
                id="posY"
                type="number"

                min="-100"
                max="400"

                step="0.1"

                value="45"
            >

        </div>


        <!-- KHOẢNG CÁCH -->

        <div class="control">

            <label>
                Khoảng cách chữ (px)
            </label>

            <input
                id="letterSpacing"
                type="number"

                min="-20"
                max="50"

                step="0.1"

                value="0"
            >

        </div>


        <!-- CĂN CHỮ -->

        <div class="control">

            <label>
                Căn chữ
            </label>

            <select id="align">

                <option value="center">
                    Giữa
                </option>

                <option value="left">
                    Trái
                </option>

                <option value="right">
                    Phải
                </option>

            </select>

        </div>


        <!-- ĐỘ ĐẬM -->

        <div class="control">

            <label>
                Độ đậm
            </label>

            <select id="fontWeight">

                <option value="normal">
                    Thường
                </option>

                <option value="bold">
                    Đậm
                </option>

            </select>

        </div>


        <!-- CHIỀU LẬT -->

        <div class="control">

            <label>
                Chiều lật
            </label>

            <select id="mirror">

                <option value="horizontal">
                    Lật ngang - gương
                </option>

                <option value="none">
                    Không lật
                </option>

                <option value="vertical">
                    Lật dọc
                </option>

                <option value="both">
                    Lật cả hai
                </option>

            </select>

        </div>


        <!-- HIỆN TÂM -->

        <div class="control">

            <label>
                Hiện tâm định vị
            </label>

            <select id="showCenter">

                <option value="no">
                    Không
                </option>

                <option value="yes">
                    Có
                </option>

            </select>

        </div>


    </div>


    <!-- =================================================
         BUTTON
    ================================================= -->

    <div class="buttons">

        <button
            onclick="window.print()"
        >
            IN / LƯU PDF A4
        </button>


        <button
            class="secondary"
            onclick="resetSettings()"
        >
            ĐẶT LẠI
        </button>

    </div>

</div>



<!-- =====================================================
     TRANG A4
===================================================== -->

<div class="workspace">

    <div
        class="page"
        id="page"
    >

        <div
            class="text"
            id="preview"
        ></div>


        <div
            class="center-point"
            id="centerPoint"
        ></div>

    </div>

</div>



<script>


/* =========================================================
   ELEMENT
========================================================= */

const $ =
    id =>
    document.getElementById(id);


const textInput =
    $("textInput");

const capHeight =
    $("capHeight");

const scaleX =
    $("scaleX");

const posX =
    $("posX");

const posY =
    $("posY");

const letterSpacing =
    $("letterSpacing");

const align =
    $("align");

const fontWeight =
    $("fontWeight");

const mirror =
    $("mirror");

const showCenter =
    $("showCenter");

const preview =
    $("preview");

const centerPoint =
    $("centerPoint");


/* =========================================================
   TỶ LỆ CAP HEIGHT
========================================================= */

let capHeightRatio = null;


/*
   Đo chiều cao thực tế của chữ H.

   Font-size 100px
   → đo actualBoundingBoxAscent / Descent

   Sau đó tính ngược ra font-size
   cần thiết để chữ in hoa cao đúng
   số cm người dùng nhập.
*/

async function measureFont() {

    try {

        await document.fonts.load(
            '100px "UTM HelvetIns"'
        );


        const canvas =
            document.createElement(
                "canvas"
            );


        const ctx =
            canvas.getContext("2d");


        ctx.font =
            '400 100px "UTM HelvetIns"';


        const metrics =
            ctx.measureText("H");


        if (
            metrics.actualBoundingBoxAscent
            !== undefined
            &&
            metrics.actualBoundingBoxDescent
            !== undefined
        ) {

            capHeightRatio =

                (
                    metrics.actualBoundingBoxAscent
                    +
                    metrics.actualBoundingBoxDescent
                ) / 100;

        }

        else {

            /*
               Giá trị dự phòng.
            */

            capHeightRatio =
                0.72;
        }

    }

    catch(error) {

        capHeightRatio =
            0.72;
    }

}


/* =========================================================
   TÍNH FONT SIZE
========================================================= */

function getFontSizeFromCapHeight(cm) {

    /*
       CSS:

       96 px = 1 inch

       1 inch = 2.54 cm
    */


    const targetPixels =

        Number(cm)
        * 96
        / 2.54;


    if (
        !capHeightRatio
        ||
        capHeightRatio <= 0
    ) {

        return targetPixels / 0.72;

    }


    return
        targetPixels
        / capHeightRatio;

}


/* =========================================================
   UPDATE
========================================================= */

function updatePreview() {


    /* ---------------------------------
       Nội dung
    --------------------------------- */

    preview.textContent =
        textInput.value;


    /* ---------------------------------
       Chiều cao chữ
    --------------------------------- */

    const fontSize =

        getFontSizeFromCapHeight(
            capHeight.value
        );


    preview.style.fontSize =
        fontSize + "px";


    /* ---------------------------------
       Độ đậm
    --------------------------------- */

    preview.style.fontWeight =
        fontWeight.value;


    /* ---------------------------------
       Khoảng cách chữ
    --------------------------------- */

    preview.style.letterSpacing =

        letterSpacing.value
        + "px";


    /* ---------------------------------
       Căn chữ
    --------------------------------- */

    preview.style.textAlign =
        align.value;


    /* ---------------------------------
       Vị trí
    --------------------------------- */

    /*
       width = 190 mm

       Vì left là mép trái
       nên lấy X - 95 để
       X trở thành tâm.
    */

    preview.style.left =

        (
            Number(posX.value)
            - 95
        )
        + "mm";


    preview.style.top =

        Number(posY.value)
        + "mm";


    /* ---------------------------------
       Co ngang
    --------------------------------- */

    const sx =

        Number(scaleX.value)
        / 100;


    /* ---------------------------------
       LẬT
    --------------------------------- */

    let mirrorX = 1;

    let mirrorY = 1;


    if (
        mirror.value ===
        "horizontal"
    ) {

        mirrorX = -1;

    }


    else if (
        mirror.value ===
        "vertical"
    ) {

        mirrorY = -1;

    }


    else if (
        mirror.value ===
        "both"
    ) {

        mirrorX = -1;

        mirrorY = -1;

    }


    /* ---------------------------------
       TRANSFORM
    --------------------------------- */

    preview.style.transform =

        "translateY(-50%) "
        +

        "scale("
        +

        (
            sx
            * mirrorX
        )

        +

        ","

        +

        mirrorY

        +

        ")";


    /* ---------------------------------
       Hiển thị giá trị
    --------------------------------- */

    $("scaleValue")
        .textContent =
        scaleX.value;


    /* ---------------------------------
       Tâm
    --------------------------------- */

    centerPoint.style.left =
        posX.value + "mm";


    centerPoint.style.top =
        posY.value + "mm";


    centerPoint.style.display =

        showCenter.value === "yes"
        ? "block"
        : "none";

}


/* =========================================================
   RESET
========================================================= */

function resetSettings() {


    textInput.value =
        "CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM";


    capHeight.value =
        2;


    scaleX.value =
        100;


    posX.value =
        105;


    posY.value =
        45;


    letterSpacing.value =
        0;


    align.value =
        "center";


    fontWeight.value =
        "normal";


    mirror.value =
        "horizontal";


    showCenter.value =
        "no";


    updatePreview();

}


/* =========================================================
   REAL-TIME UPDATE
========================================================= */

[
    textInput,
    capHeight,
    scaleX,
    posX,
    posY,
    letterSpacing,
    align,
    fontWeight,
    mirror,
    showCenter

].forEach(

    element => {

        element.addEventListener(
            "input",
            updatePreview
        );


        element.addEventListener(
            "change",
            updatePreview
        );

    }

);


/* =========================================================
   KHỞI TẠO
========================================================= */

document.fonts.ready.then(
    async () => {

        await measureFont();

        updatePreview();

    }
);


/*
   Hiển thị ngay cả khi font
   chưa tải xong.
*/

updatePreview();

</script>

</body>
</html>
